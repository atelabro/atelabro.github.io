<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miso the Cat</title>
  <meta name="description" content="Small paws, big adventure. A cozy collection of mini games for kids.">
  <meta property="og:title" content="Miso the Cat">
  <meta property="og:description" content="Small paws, big adventure. A cozy collection of mini games for kids.">
  <meta property="og:image" content="https://atelabro.github.io/assets/miso-banner.jpg">
  <link rel="icon" href="../assets/miso.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a2616 url("../assets/miso-banner.jpg") center / cover no-repeat fixed;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 18, 8, 0.6);
      z-index: 1;
    }

    #content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #fff;
      padding: 40px 24px;
      display: none;
    }

    #content img.logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #content h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    #content p {
      font-size: 1.1rem;
      margin-bottom: 32px;
      color: #f3e6d8;
    }

    .badges {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badges a, .badges span {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 170px;
      padding: 10px 22px;
      border-radius: 14px;
      text-align: left;
      text-decoration: none;
    }

    .badges a { background: #d9661f; color: #fff; }
    .badges span { border: 2px dashed rgba(255, 255, 255, 0.6); color: #fff; }
    .badges small { font-size: 0.75rem; opacity: 0.9; }
    .badges strong { font-size: 1.2rem; }
  </style>
  <script>
    // Set iosLive to true once the App Store listing is approved. Also swap the
    // "Coming soon" span below for a link to iosUrl.
    var iosLive = false;
    var iosUrl = "https://apps.apple.com/app/id6818754894";
    var androidUrl = "https://play.google.com/store/apps/details?id=com.alab.misosworld";
    var ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
      window.location.replace(androidUrl);
    } else if (iosLive && /iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace(iosUrl);
    } else {
      document.addEventListener("DOMContentLoaded", function() {
        document.getElementById("content").style.display = "block";
      });
    }
  </script>
</head>
<body>
  <div id="overlay"></div>
  <div id="content">
    <img class="logo" src="../assets/miso.png" alt="Miso the Cat icon">
    <h1>Miso the Cat</h1>
    <p>Small paws, big adventure.</p>
    <div class="badges">
      <span><small>Coming soon to</small><strong>App Store</strong></span>
      <a href="https://play.google.com/store/apps/details?id=com.alab.misosworld"><small>Get it on</small><strong>Google Play</strong></a>
    </div>
  </div>
</body>
</html>
