<html lang="mk">
<head>
  <meta charset="utf-8">

  <title>Цагери — Замисли желба.</title>
  <meta name="description" content="Твојот час. Твојата желба. Преземи Цагери: значења на часовите, омилени желби и потсетници на македонски.">
  <link rel="canonical" href="https://atelabro.github.io/cageri/">
  <meta property="og:title" content="Цагери — Замисли желба.">
  <meta property="og:description" content="Твојот час. Твојата желба. Достапно на App Store. Наскоро за Android.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://atelabro.github.io/cageri/">
  <meta property="og:image" content="https://atelabro.github.io/cageri/assets/header.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f5eb;color:#203e32;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:flex;flex-direction:column}main{width:min(1100px,100%);margin:auto;text-align:center;padding:48px 24px 28px}.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-size:30px;font-weight:850;letter-spacing:-1px}.brand img{width:48px;height:48px;object-fit:contain}.hero{display:block;width:100%;height:auto;margin:28px auto 12px;border-radius:28px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px;margin:16px 0}p{font-size:17px;line-height:1.6;max-width:580px;margin:12px auto;color:#5c6b60}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:28px 0 16px}.store,.soon{min-width:220px;border-radius:16px;padding:16px 26px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}.store{background:#203e32;color:#fff}.store:hover{background:#315443}.store:focus-visible,a:focus-visible{outline:3px solid #9a496b;outline-offset:5px}.store small,.soon small{font-size:12px;margin-bottom:4px}.store strong,.soon strong{font-size:21px}.soon{background:#e9ecdf;color:#627060}.note{font-size:13px}footer{text-align:center;padding:24px;display:flex;justify-content:center;gap:24px;flex-wrap:wrap}footer a{color:#526457;font-size:13px}#redirect-status{font-size:14px}@media(max-width:540px){main{padding:28px 16px 16px}.hero{margin-top:24px;border-radius:16px}h1{letter-spacing:-1px}.actions{flex-direction:column;align-items:stretch}.store,.soon{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="assets/logo.png" alt="" width="48" height="48"><span>цагери</span></div>
    <img class="hero" src="assets/header.png" alt="11:11 — Замисли желба." width="3840" height="1646">
    <h1>Твојот час. Твојата желба.</h1>
    <p>Откриј ги значењата на часовите, зачувај ги омилените желби и сподели го моментот.</p>
    <div class="actions">
      <a class="store" href="https://apps.apple.com/app/id6817363033"><small>Преземи на</small><strong>App Store</strong></a>
      <div class="soon" id="android-option"><small>Наскоро на</small><strong>Google Play</strong></div>
    </div>
    <p id="redirect-status" role="status"></p>
    <p class="note">На македонски · Без регистрација · За забава</p>
  </main>
  <footer><a href="support.html">Поддршка / Support</a><a href="privacy.html">Приватност / Privacy</a></footer>
  <script>
    (() => {
      const iosUrl = 'https://apps.apple.com/app/id6817363033';
      const androidUrl = 'https://play.google.com/store/apps/details?id=com.alab.cageri';
      // Set true only after the public Google Play production release is live.
      const androidLive = false;
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);
      const preview = new URLSearchParams(location.search).get('preview') === '1';
      if (androidLive) {
        const link = document.createElement('a');
        link.className = 'store'; link.href = androidUrl;
        link.innerHTML = '<small>Преземи на</small><strong>Google Play</strong>';
        document.getElementById('android-option').replaceWith(link);
      }
      if (!preview && (isIOS || (isAndroid && androidLive))) {
        document.getElementById('redirect-status').textContent = 'Се отвора продавницата… Ако не се отвори, користи го копчето погоре.';
        location.replace(isIOS ? iosUrl : androidUrl);
      } else if (isAndroid && !androidLive) {
        document.getElementById('redirect-status').textContent = 'Android верзијата пристигнува наскоро. Провери повторно тука.';
      }
    })();
  </script>
</body>
</html>
